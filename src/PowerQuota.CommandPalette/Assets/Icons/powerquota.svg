<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#222738" />
      <stop offset="100%" stop-color="#0E1118" />
    </radialGradient>

    <!-- Outer Glow / Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Quota Track Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.35" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Rect -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" filter="url(#cardShadow)" />

  <!-- Outer Gauge Meter Track (270 degree arc) -->
  <!-- Center: 256, 256; Radius: 140 -->
  <path d="M 157 355 A 140 140 0 1 1 355 355" fill="none" stroke="url(#trackGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Active Quota Meter Arc (Cyan to Purple Gradient) -->
  <path d="M 157 355 A 140 140 0 1 1 340 180" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)" />

  <!-- Gauge Tick Marks -->
  <circle cx="157" cy="355" r="4" fill="#00E5FF" />
  <circle cx="116" cy="256" r="4" fill="#38BDF8" />
  <circle cx="157" cy="157" r="4" fill="#60A5FA" />
  <circle cx="256" cy="116" r="4" fill="#818CF8" />
  <circle cx="355" cy="157" r="4" fill="#A78BFA" />

  <!-- Center Energy Bolt / AI Spark Symbol -->
  <g filter="url(#glow)">
    <path d="M 276 156 L 204 268 L 256 268 L 236 356 L 316 236 L 264 236 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Quota Dot Accent -->
  <circle cx="340" cy="180" r="10" fill="#FFFFFF" filter="url(#glow)" />
</svg>
