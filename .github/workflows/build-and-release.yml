name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish PowerQuota Extension
        run: dotnet publish src/PowerQuota.CommandPalette/PowerQuota.CommandPalette.csproj -c Release -r win-x64 --self-contained false -o ./publish

      - name: Create Release Zip
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath PowerQuota-win-x64.zip -Force

      - name: Build MSIX Store Bundle
        shell: pwsh
        env:
          PackageIdentityName: 39231EricJamesSoltys
          PackageIdentityPublisher: D497347D-E082-41C5-8B70-20EA278E5213
          PublisherDisplayName: Eric James Soltys
        run: .\build-msix.ps1 -ForStore -Bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PowerQuota-win-x64.zip
            artifacts/*.msixbundle
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
