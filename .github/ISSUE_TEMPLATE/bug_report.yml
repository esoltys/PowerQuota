name: 🐛 Bug Report
description: Report something that isn't working as expected in PowerQuota.
title: 'Bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PowerQuota! Please search existing issues before opening a new one.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using a supported version of Windows 10/11 and PowerToys.
          required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Affected AI Provider / Area
      description: Which provider or feature area is affected?
      options:
        - General / App Extension
        - PowerToys Dock Integration
        - Claude Code
        - Codex / ChatGPT
        - Cursor
        - Gemini Code Assist
        - GitHub Copilot
        - Minimax
        - Kimi for Coding
        - Settings / Vault Storage
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Windows version, PowerToys version, and PowerQuota version.
      placeholder: e.g. Windows 11 (23H2), PowerToys 0.88, PowerQuota 1.0.0 (MSIX / Store)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we trigger this bug?
      placeholder: |
        1. Open Command Palette (Win + Alt + Space)
        2. Select '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Diagnostic Logs
      description: Paste relevant logs from %LOCALAPPDATA%\\PowerQuota\\extension.log or drag and drop screenshots here.
      placeholder: Paste log lines or drag & drop screenshots...
    validations:
      required: false

  - type: textarea
    id: dev_notes
    attributes:
      label: Technical Context / Suggested Fix (Optional)
      description: If you've looked at the source code, feel free to link files or suggest a fix here!
      placeholder: File paths, root cause thoughts, or proposed code changes...
    validations:
      required: false
