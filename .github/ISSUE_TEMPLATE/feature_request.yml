name: ✨ Feature Request
description: Propose a new feature, new AI provider, or improvement for PowerQuota.
title: 'Feature: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to PowerQuota!

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I have searched existing issues to ensure this feature hasn't already been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what problem or pain point this solves.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What would you like PowerQuota to do? (e.g. New AI provider support, new dock visual style, new polling options).
      placeholder: It would be great if...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've tried.
      placeholder: Alternatively, I tried...
    validations:
      required: false

  - type: textarea
    id: technical
    attributes:
      label: Proposed Implementation Details (Optional)
      description: If you have ideas on provider APIs, credentials schema, or UI layout, detail them here.
      placeholder: Suggestions for API endpoints, data models, or Command Palette UI flow...
    validations:
      required: false
